name: Diagnóstico temporário (conteúdo do pacote do ITR)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: |
          python - <<'P'
          import sys, io, zipfile, urllib.request
          sys.path.insert(0, "pipeline"); import rad
          b = urllib.request.urlopen(urllib.request.Request(rad.URL.format(nsd=162001), headers=rad.UA), timeout=300).read()
          z = zipfile.ZipFile(io.BytesIO(b))
          for i in z.infolist():
              print("::notice title=zip::%s %d" % (i.filename, i.file_size))
              if i.filename.lower().endswith(".xml"):
                  t = z.read(i.filename)[:3000].decode("latin-1", "replace").replace("\n", " ")
                  print("::notice title=xml-inicio::%s" % t[:900])
              if i.filename.lower().endswith(".zip"):
                  zz = zipfile.ZipFile(io.BytesIO(z.read(i.filename)))
                  for j in zz.infolist():
                      print("::notice title=interno::%s/%s %d" % (i.filename, j.filename, j.file_size))
          P
